name: Bug
description: Something in the app doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page or exercise
      placeholder: e.g. Library → Mistake notebook, or exercise a1.hello.be-am
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 141 on Android, Safari on iPhone 15
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Was any progress lost?
      options: ["No", "Yes", "Not sure"]
